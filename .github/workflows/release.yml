name: Release

on:
  release:
    types:
      - published

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7

      - name: 🔢 Adjust version number
        shell: bash
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version,,}"
          version="${version#v}"
          yq e -P -o=json \
            -i ".version = \"${version}\"" \
            "${{ github.workspace }}/custom_components/qss/manifest.json"

      - name: 📦 Created zipped release package
        shell: bash
        run: |
          cd "${{ github.workspace }}/custom_components/qss"
          zip qss.zip -r ./

      - name: 🔏 Sign release package
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: ${{ github.workspace }}/custom_components/qss/qss.zip

      - name: ⬆️ Upload zip to release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: ${{ github.workspace }}/custom_components/qss/qss.zip

        # Upload this one in the future, currently problematic for HACS
        # https://github.com/frenck/spook/issues/286
        # ${{ github.workspace }}/custom_components/spook/spook.zip.sigstore

  sync-versions:
    name: Sync versions
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # custom_components/qss/manifest.json and pyproject.toml are only
      # bumped in the ephemeral checkout used to build the release zip
      # above, so the version committed to git keeps drifting away from
      # the actually published release. This job closes that gap by
      # opening a small pull request that brings both files back in sync
      # with the release that just got published.
      - name: ⤵️ Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 🔢 Determine released version
        id: version
        shell: bash
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version,,}"
          version="${version#v}"
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: ⚙️ Install Poetry
        uses: abatilo/actions-poetry@v4.0.0

      - name: 🔧 Bump manifest.json and pyproject.toml
        id: bump
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"

          yq e -P -o=json -i ".version = \"${version}\"" custom_components/qss/manifest.json
          poetry version "${version}"

          if git diff --quiet -- custom_components/qss/manifest.json pyproject.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📬 Open pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          branch="chore/sync-version-${version}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add custom_components/qss/manifest.json pyproject.toml
          git commit -m "chore: sync version to ${version} after release"
          git push --force origin "${branch}"

          if [ -z "$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number')" ]; then
            gh pr create \
              --title "chore: sync version to ${version} after release" \
              --body "Automated follow-up to the [\`${{ github.event.release.tag_name }}\`](${{ github.event.release.html_url }}) release: keeps the \`version\` fields in \`custom_components/qss/manifest.json\` and \`pyproject.toml\` in sync with the latest published release, so they no longer drift apart from what users actually installed. Please review and merge — branch protection on \`main\` requires it." \
              --base main \
              --head "${branch}"
          fi
