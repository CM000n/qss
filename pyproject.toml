[project]
name = "qss"
description = "QuestDB State Storage (QSS) for Home Assistant"
license = "MIT"
keywords = [
  "homeassistant",
  "questdb",
  "database",
  "timeseries",
  "analytics",
  "storage",
]
dynamic = ["version", "dependencies"]
readme = "README.md"
authors = [{name = "CM000n"}]
requires-python = '>=3.13.2,<3.14'

[tool.poetry]
version = "v0.1.2"
package-mode = false
requires-poetry = '>=2.0,<3.0'

[tool.poetry.dependencies]
homeassistant = "^2026"
questdb = "^4.1.0"
tenacity = "^9.0.0"

[tool.poetry.group.dev.dependencies]
voluptuous-stubs = "^0.1"
homeassistant-stubs = "^2026"
pre-commit = "^4.0.0"
pytest-homeassistant-custom-component = "0.13.316"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
fix = true
lint.exclude = ["tests/**"]
lint.select = ["ALL"]
lint.extend-ignore = ["D203", "D213", "COM812", "CPY001"]
lint.pydocstyle.convention = "google"
lint.isort.split-on-trailing-comma = false
format.docstring-code-format = true
format.skip-magic-trailing-comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = [".git", "*.egg", "build", "dist"]
required_plugins = ["pytest-homeassistant-custom-component"]
addopts = "--cov=custom_components.qss --cov-report=term-missing"

[tool.coverage.run]
source = ["custom_components/qss"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
